name: Test

on:
  pull_request:
    branches: [main]
  # Also run on direct pushes to main. deploy-backend.yaml re-runs the Go
  # tests before deploying, but nothing ran the FRONTEND checks on a push,
  # so a commit straight to main shipped the PWA with no test run at all.
  #
  # NOTE: this reports, it does not gate. deploy-frontend.yaml triggers on
  # the same push and has no `needs`/`workflow_run` dependency on this
  # workflow, so Pages still publishes in parallel regardless of the result.
  # Making it a true gate means restructuring deploy-frontend to wait on
  # this workflow (or enabling a branch protection rule).
  push:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        working-directory: backend
        # go.sum is committed, so this builds in the default -mod=readonly
        # mode and verifies module checksums. `go mod tidy` belongs on a
        # dev machine, not in CI (it can silently rewrite go.mod/go.sum).
        run: go mod download

      - name: Run tests
        working-directory: backend
        # No env vars or AWS access needed: service tests run against an
        # in-memory fake repo and cmd/api tests only exercise bodyReader.
        # Router setup is lazy (setupRouter), so nothing reads TABLE_NAME /
        # ALLOWED_ORIGIN at test time.
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Run vet
        working-directory: backend
        run: go vet ./...

      - name: Check formatting
        working-directory: backend
        # gofmt drift slipped onto main once (3 files); fail fast instead.
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "gofmt needed on:"
            echo "$UNFORMATTED"
            exit 1
          fi

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check HTML syntax
        run: |
          # Basic HTML validation
          for file in frontend/*.html; do
            if grep -q "<html" "$file"; then
              echo "Checking $file..."
              # Check for unclosed tags (basic check)
              if ! grep -q "</html>" "$file"; then
                echo "Error: Missing </html> in $file"
                exit 1
              fi
            fi
          done
          echo "HTML check passed"

      - name: Check JavaScript syntax
        run: |
          # Install Node for basic JS validation
          for file in frontend/js/*.js; do
            echo "Checking $file..."
            node --check "$file" || exit 1
          done
          echo "JavaScript syntax check passed"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - name: Install frontend test dependencies
        working-directory: frontend
        # --frozen-lockfile: bun.lock is committed, so CI must install exactly
        # those versions and fail rather than silently resolve something else.
        # These are devDependencies for the test harness only — the app ships
        # as plain ES modules with no build step and no runtime dependencies.
        run: bun install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        # `node --check` above only catches syntax. This catches the class of
        # mistake that actually reaches production in a no-build-step codebase:
        # a typo'd identifier, an unused binding whose use was meant to happen,
        # an accidental global, a shadowed variable.
        run: bun run lint

      - name: Run frontend tests
        working-directory: frontend
        run: bun test
